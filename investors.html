<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Moku — Investor Preview</title>
<meta name="description" content="A guided walkthrough of Moku, Hawaii's public-records property intelligence platform — try the live product, then leave your notes.">
<meta property="og:title" content="Moku — Investor Preview">
<meta property="og:description" content="Try the live product, then tell us what you actually think.">
<meta property="og:type" content="website">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%2317150F"/><text x="29" y="45" font-family="Georgia,serif" font-size="38" fill="%23FBF9F5" text-anchor="middle">M</text><circle cx="50" cy="41" r="5" fill="%23E8C87E"/></svg>'>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --bg:#FBF9F5; --card:#FFFFFF; --ink:#17150F; --ink2:#57534A; --ink3:#8C867A;
  --accent:#0E6E56; --brass:#9C7A3C; --line:rgba(23,21,15,.11); --line2:rgba(23,21,15,.18);
  --wash:#F3F0E9; --flag:#A5442E;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",-apple-system,BlinkMacSystemFont,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.62 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 22px}
.top{border-bottom:1px solid var(--line)}
.topin{max-width:820px;margin:0 auto;padding:15px 22px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:19px;font-weight:600}
.brand em{font-style:normal;color:var(--brass)}
.topin .tag{margin-left:auto;font:600 11px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
h1{font-family:var(--serif);font-size:clamp(34px,6.4vw,56px);font-weight:500;letter-spacing:-.025em;line-height:1.04;margin:16px 0 18px;text-wrap:balance}
h2{font-family:var(--serif);font-size:clamp(23px,4vw,30px);font-weight:500;letter-spacing:-.015em;margin:54px 0 6px;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--brass);text-transform:uppercase}
.lede{font-size:18.5px;color:var(--ink2);max-width:62ch}
.lede b{color:var(--ink);font-weight:600}
.sub{font-size:15.5px;color:var(--ink2);margin-bottom:16px;max-width:64ch}
section{padding-bottom:2px}
.hero{padding:52px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
.card .t{font-weight:600;font-size:15px}
.card .d{font-size:13.6px;color:var(--ink2);margin-top:4px;line-height:1.5}
.card .x{font-family:var(--mono);font-size:11px;color:var(--brass);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.try{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:15px 17px;transition:transform .12s ease,box-shadow .16s ease}
.try:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(23,21,15,.09)}
.try .n{font-family:var(--mono);font-size:11px;color:var(--brass)}
.try .t{font-weight:600;font-size:15.5px;margin-top:3px}
.try .d{font-size:13.6px;color:var(--ink2);margin-top:3px;line-height:1.5}
.try .go{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:8px;display:inline-block}
.stats{border:1px solid var(--line2);border-radius:16px;overflow:hidden;margin-top:6px}
.srow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;padding:13px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:none}
.srow .l{font-size:14px;color:var(--ink2)}
.srow .l b{color:var(--ink);font-weight:600}
.srow .v{font-family:var(--serif);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12.6px;color:var(--ink3);margin-top:10px;line-height:1.55}
.honest{background:var(--wash);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:8px}
.honest ul{list-style:none;margin-top:10px}
.honest li{font-size:14.5px;color:var(--ink2);padding:6px 0 6px 22px;position:relative;line-height:1.55}
.honest li::before{content:"";position:absolute;left:4px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.honest li b{color:var(--ink);font-weight:600}
form{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:20px 20px 22px;margin-top:8px}
label{display:block;font:600 12px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
input,select,textarea{width:100%;font:16px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:78px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.row2{grid-template-columns:1fr}}
button.send{margin-top:18px;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:13px 26px;font:600 14.5px var(--sans);cursor:pointer;min-height:44px}
button.send:hover{opacity:.9}
button.ghost{background:none;border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:10px 18px;font:600 13px var(--sans);cursor:pointer;min-height:40px;margin-right:8px}
.msg{margin-top:14px;font-size:14px;padding:12px 14px;border-radius:10px;display:none}
.msg.ok{display:block;background:rgba(14,110,86,.10);border:1px solid rgba(14,110,86,.28);color:var(--accent)}
.msg.warn{display:block;background:rgba(165,68,46,.09);border:1px solid rgba(165,68,46,.28);color:var(--flag)}
.fb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-top:10px;background:var(--card)}
.fb .who{font-weight:600;font-size:14.5px}
.fb .role{font-family:var(--mono);font-size:11px;color:var(--brass);text-transform:uppercase;letter-spacing:.04em;margin-left:8px}
.fb .q{font:600 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:10px}
.fb .a{font-size:14px;color:var(--ink2);margin-top:2px;white-space:pre-wrap;line-height:1.55}
.fb .when{font-size:11.5px;color:var(--ink3);margin-top:8px}
footer{border-top:1px solid var(--line);margin-top:56px;padding:24px 0 70px;font-size:13px;color:var(--ink3);line-height:1.65}
footer b{color:var(--ink2);font-weight:600}
</style>

<div id="app"></div>

<script id="app-js">
(function(){
  var SITE = "https://micahskylab-code.github.io/moku/";
  var MAIL = "micahskylab@gmail.com";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function readState(){ return {feedback:[]}; }

  var TRIES = [
    { n:"01", t:"A home that sold twice — see the real appreciation",
      d:"Kailua, Oʻahu. County records show $3,150,000 in March 2025 and $695,000 in November 2001 — Moku computes ▲353% from the two recorded deeds, not an estimate.",
      href: SITE + "#tmk=1440240230000", go:"Open the record →" },
    { n:"02", t:"Look up any address in Hawaiʻi",
      d:"Type a real address or TMK. You get county-assessed value, exact property tax at current rates, rent benchmark, short-term-rental legality, and the full hazard picture — each tappable to its government source.",
      href: SITE, go:"Open the map →" },
    { n:"03", t:"Turn on “Sold prices” and zoom into an Oʻahu street",
      d:"Real recorded sale prices painted on the actual parcels, from a public-records request. Zoom to street level in Kailua or Kaimukī. A floating strip reads the median of whatever is on screen.",
      href: SITE, go:"Open the map →" },
    { n:"04", t:"“Is this vacation rental legal?”",
      d:"The question that decides millions in Hawaiʻi value. Moku answers per parcel from the county registries, and states each county's rule — including Maui's phase-out dates.",
      href: SITE + "hawaii-short-term-rental-rules.html", go:"See the rules →" },
    { n:"05", t:"A town page — the search-traffic engine",
      d:"64 of these are live, one per town, each a sourced record page built to rank on Google and to be quoted by AI answer engines.",
      href: SITE + "poipu-property-records.html", go:"Open Poʻipū →" },
    { n:"06", t:"Market intelligence",
      d:"Every island's single-family median, sold count, active inventory and year-over-year — plus Kauaʻi in depth. Every figure sourced.",
      href: SITE + "market.html", go:"Open the market page →" }
  ];

  var FACTS = [
    ["<b>110,127</b> Oʻahu parcels carry real recorded sale history","obtained by public-records request"],
    ["<b>40,414</b> of them sold twice — real, deed-measured appreciation","median 4.3%/yr"],
    ["Sampled sales re-derived from the raw county file and matched","400 / 400"],
    ["Counties with exact property-tax math at FY2026–27 rates","all 4"],
    ["Hazard layers fused per parcel: flood, tsunami, lava, sea-level, wildfire","5"],
    ["Town record pages live, machine-readable for AI citation","64"]
  ];

  var WHYNOW = [
    ["Zillow <b>deleted</b> its climate-risk scores in Dec 2025 after agents said the honest numbers hurt sales.","The truth position is vacant — and a company paid by agent advertising can't take it."],
    ["First Street, the climate-score company, was <b>sued by Nebraska's Attorney General</b> in Aug 2026 over unreliable scores.","Buyers are moving from model guesses to official records. Moku publishes records, with the source attached."],
    ["In an audit of <b>1,567</b> ChatGPT property citations, the major portals were cited <b>zero</b> times — their data is walled.","Whoever is the machine-readable source of parcel truth wins the answer, and that slot is still open."],
    ["CoStar paid <b>$800M</b> for Zonda's new-home data in 2026.","Assembled property data is the asset that gets bought. Hawaiʻi's is unassembled — except here."]
  ];

  var HONEST = [
    "<b>No audience yet.</b> The product is live and free, but it has not been launched or marketed. There is no traffic story to show you.",
    "<b>No revenue yet.</b> Nothing is being sold today. The first intended sale is a monthly records memo to a land developer.",
    "<b>Solo founder, agent-built code.</b> One person, with AI doing the engineering. That is a real key-person risk and it is priced into any conversation.",
    "<b>The owner's real-estate license is pending.</b> Moku is deliberately a public-records publisher — not a brokerage. It offers no valuations, no advice, no listings.",
    "<b>Two islands are dark.</b> Kauaʻi and Hawaiʻi County publish no sales data at all; records requests for both are written and waiting to be sent. Rather than fake it, the map stays empty there."
  ];

  function renderBody(state){
    var fb = [];
    var tries = TRIES.map(function(t){
      return '<a class="try" href="'+t.href+'" target="_blank" rel="noopener">'
        + '<div class="n">'+t.n+'</div><div class="t">'+t.t+'</div>'
        + '<div class="d">'+t.d+'</div><span class="go">'+t.go+'</span></a>';
    }).join("");

    var facts = FACTS.map(function(f){
      return '<div class="srow"><div class="l">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>';
    }).join("");

    var why = WHYNOW.map(function(w){
      return '<div class="card"><div class="d" style="font-size:14.5px;color:var(--ink)">'+w[0]+'</div>'
        + '<div class="d">'+w[1]+'</div></div>';
    }).join("");

    var honest = HONEST.map(function(h){ return "<li>"+h+"</li>"; }).join("");

    var fbList = fb.length ? fb.map(function(f){
      var parts = "";
      if (f.strong) parts += '<div class="q">Strongest thing here</div><div class="a">'+esc(f.strong)+'</div>';
      if (f.missing) parts += '<div class="q">What is missing / what you would need to see</div><div class="a">'+esc(f.missing)+'</div>';
      if (f.pay) parts += '<div class="q">Who should pay for this, and would they</div><div class="a">'+esc(f.pay)+'</div>';
      if (f.worked) parts += '<div class="q">Did it work for you</div><div class="a">'+esc(f.worked)+'</div>';
      return '<div class="fb"><span class="who">'+esc(f.who||"Anonymous")+'</span>'
        + (f.role ? '<span class="role">'+esc(f.role)+'</span>' : "")
        + parts + '<div class="when">'+esc(f.when||"")+'</div></div>';
    }).join("") : '<p class="note">No notes yet — yours will be the first, and it will appear here for everyone reviewing.</p>';

    return ''
    + '<div class="top"><div class="topin"><span class="brand">Moku<em>.</em></span>'
    + '<span class="tag">Investor preview &middot; try it &amp; tell us</span></div></div>'
    + '<div class="wrap">'

    + '<section class="hero">'
    + '<div class="eyebrow">Hawaiʻi property, from the official record</div>'
    + '<h1>The truth about any piece of land in Hawaiʻi — with a receipt on every number.</h1>'
    + '<p class="lede">Moku assembles what Hawaiʻi\'s four counties, the State and the federal government already publish — assessed value, exact tax, recorded sale prices, short-term-rental legality, and every hazard — into <b>one answer per parcel, each figure linked to its government source.</b> It is free, it is live, and it is not a brokerage.</p>'
    + '<p class="lede" style="margin-top:14px">This page is for people evaluating it. <b>Please use the real product first</b> — the six things below take about five minutes — then leave your notes at the bottom. They are read directly by the team building it.</p>'
    + '</section>'

    + '<h2>Try it — the product, not a demo</h2>'
    + '<p class="sub">These open the live site in a new tab. Everything you see is a real government record.</p>'
    + '<div class="grid">' + tries + '</div>'

    + '<h2>What is actually built</h2>'
    + '<p class="sub">Verified numbers, not projections.</p>'
    + '<div class="stats">' + facts + '</div>'
    + '<p class="note">The sale history came from a formal public-records request (Hawaiʻi\'s UIPA) to the City &amp; County of Honolulu. An independent checker re-derives sampled sales from the raw county file before every release — the last run matched 400 of 400. Property-tax math is verified to the cent against each county\'s adopted rates.</p>'

    + '<h2>Why this window is open now</h2>'
    + '<p class="sub">Four things that happened recently, each independently reported.</p>'
    + '<div class="grid">' + why + '</div>'

    + '<h2>What we think it becomes</h2>'
    + '<p class="sub">Free for the public — that is the audience and the brand. The revenue is intended to come from people who need the records assembled and dependable.</p>'
    + '<div class="grid">'
    + '<div class="card"><div class="t">Developers &amp; their lenders</div><div class="d">Lenders require independent market and absorption studies for construction loans; those run roughly $15,000–$50,000 each and are stale the day they arrive. Moku is the always-on records feed underneath one.</div><div class="x">First intended sale</div></div>'
    + '<div class="card"><div class="t">Hawaiʻi real-estate professionals</div><div class="d">Deed-recorded comps, per-parcel rental legality, parcel watchlists and exports — the daily instrument for agents, appraisers and property managers.</div><div class="x">Subscription</div></div>'
    + '<div class="card"><div class="t">Insurers &amp; lenders</div><div class="d">Post-Lahaina, Hawaiʻi carriers and lenders need per-parcel hazard truth they can audit. Moku publishes official designations with their sources — records, not a proprietary score that can be disputed.</div><div class="x">Data licensing</div></div>'
    + '<div class="card"><div class="t">The answer engines</div><div class="d">As property questions move from search boxes to AI assistants, the cited source of Hawaiʻi parcel facts becomes the front door. Moku is already published in the machine-readable form they read.</div><div class="x">Distribution</div></div>'
    + '</div>'

    + '<h2>What is not true yet</h2>'
    + '<p class="sub">Written plainly, because you will find it anyway and because it is what we most need your read on.</p>'
    + '<div class="honest"><ul>' + honest + '</ul></div>'

    + '<h2>Tell us what you actually think</h2>'
    + '<p class="sub">Blunt is useful. Vague is not. Every note lands with the team and shapes what gets built next.</p>'
    + '<form id="fbform" autocomplete="off">'
    + '<div class="row2"><div><label for="f-who">Name or firm (optional)</label>'
    + '<input id="f-who" type="text" placeholder="Optional"></div>'
    + '<div><label for="f-role">You are</label><select id="f-role">'
    + '<option>Investor</option><option>Real-estate professional</option><option>Developer / land</option>'
    + '<option>Lender / insurer</option><option>Technologist</option><option>Other</option></select></div></div>'
    + '<label for="f-worked">Did it actually work for you?</label><select id="f-worked">'
    + '<option>Yes — it was smooth</option><option>Mostly — a few rough edges</option>'
    + '<option>No — I hit real problems</option><option>I did not try it yet</option></select>'
    + '<label for="f-strong">What is the strongest thing here?</label>'
    + '<textarea id="f-strong" placeholder="What, if anything, made you sit up?"></textarea>'
    + '<label for="f-missing">What is missing, or what would you need to see?</label>'
    + '<textarea id="f-missing" placeholder="Be specific — the gap that would decide it for you."></textarea>'
    + '<label for="f-pay">Who should pay for this, and would they?</label>'
    + '<textarea id="f-pay" placeholder="Who is the first real customer, in your view?"></textarea>'
    + '<button class="send" type="submit">Send my notes</button>'
    + '<div class="msg" id="f-msg"></div>'
    + '</form>'


    + '<footer><b>What Moku is.</b> A free public-records intelligence platform for Hawaiʻi — not a brokerage. '
    + 'Nothing is listed, advertised or sold on it, and it offers no valuations or advice. Every figure is drawn from official county, State of Hawaiʻi and federal sources and shown as those sources publish it; verify with the source before relying on any number for a transaction.<br><br>'
    + 'This page is a product preview and a request for feedback. It is not an offer to sell securities and not investment advice. '
    + 'Forward-looking statements describe intentions, not commitments.<br><br>Built on Kauaʻi &middot; ' + esc(MAIL) + '</footer>'
    + '</div>';
  }

  function renderDoc(state){
    var css = document.getElementById("app-css").textContent;
    var js  = document.getElementById("app-js").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var d = "<!doctype html>";
    return d + '<html lang="en"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>Moku Investor Preview</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">'
      + "<style id=\"app-css\">" + css + "<\/style></head><body>"
      + "<script type=\"application/json\" id=\"state\">" + json + "<\/script>"
      + '<div id="app"></div>'
      + "<script id=\"app-js\">" + js + "<\/script></body></html>";
  }

  function collect(){
    var v = function(id){ var el=document.getElementById(id); return el ? el.value.trim() : ""; };
    var now = new Date();
    return {
      who: v("f-who"), role: v("f-role"), worked: v("f-worked"),
      strong: v("f-strong"), missing: v("f-missing"), pay: v("f-pay"),
      when: now.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})
    };
  }

  function asText(e){
    return "Moku investor feedback\n"
      + "From: " + (e.who||"Anonymous") + " (" + e.role + ")\n"
      + "Did it work: " + e.worked + "\n\n"
      + "Strongest thing:\n" + (e.strong||"-") + "\n\n"
      + "What is missing:\n" + (e.missing||"-") + "\n\n"
      + "Who should pay:\n" + (e.pay||"-") + "\n";
  }

  function showMsg(kind, html){
    var m = document.getElementById("f-msg");
    if (!m) return;
    m.className = "msg " + kind;
    m.innerHTML = html;
  }

  function send(entry){
    var body = asText(entry);
    try { if (navigator.clipboard) navigator.clipboard.writeText(body); } catch(e){}
    var href = "mailto:" + MAIL + "?subject=" + encodeURIComponent("Moku investor feedback")
      + "&body=" + encodeURIComponent(body);
    showMsg("ok",
      "<b>Your notes are copied to your clipboard.</b> "
      + 'Click <a href="' + href + '" style="color:inherit;font-weight:600">send them to ' + MAIL + '</a> '
      + "— or paste them into any email. They go straight to the person building this, and they are read.");
  }

  function mount(){
    var state = readState();
    document.getElementById("app").innerHTML = renderBody(state);
    var form = document.getElementById("fbform");
    if (!form) return;
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var entry = collect();
      if (!entry.strong && !entry.missing && !entry.pay){
        showMsg("warn", "Add at least one note before sending — even one blunt line is worth more than a blank form.");
        return;
      }
      var btn = form.querySelector("button.send");
      if (btn){ btn.disabled = true; btn.textContent = "Preparing…"; }
      send(entry);
      if (btn){ btn.disabled = false; btn.textContent = "Send my notes"; }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
})();
</script>
</body>
</html>
